<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover lets the page use the whole screen, including round corners;
       the CSS then pads away from the notch and home bar with env(safe-area-inset-*). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#221D18">
  <title>Western Front 1914–18</title>
  <link rel="stylesheet" href="./css/style.css?v=11.2">
  <!-- Fetch the three fonts the first screens need straight away, instead of waiting
       for the stylesheet to ask for them (docs/PERFORMANCE.md). -->
  <link rel="preload" href="./fonts/playfair-display-black.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./fonts/im-fell-english.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./fonts/source-serif-4.woff2" as="font" type="font/woff2" crossorigin>
  <!-- Version stamps (js/version.js): each file is asked for with "?v=…", so after an
       update the phone fetches the new files instead of keeping old copies. -->
  <script type="importmap">
  {
    "imports": {
      "./js/engine/ai.js": "./js/engine/ai.js?v=11.2",
      "./js/engine/battles.js": "./js/engine/battles.js?v=11.2",
      "./js/engine/boxes.js": "./js/engine/boxes.js?v=11.2",
      "./js/engine/combat.js": "./js/engine/combat.js?v=11.2",
      "./js/engine/events.js": "./js/engine/events.js?v=11.2",
      "./js/engine/explain.js": "./js/engine/explain.js?v=11.2",
      "./js/engine/history.js": "./js/engine/history.js?v=11.2",
      "./js/engine/moves.js": "./js/engine/moves.js?v=11.2",
      "./js/engine/orders.js": "./js/engine/orders.js?v=11.2",
      "./js/engine/resources.js": "./js/engine/resources.js?v=11.2",
      "./js/engine/rng.js": "./js/engine/rng.js?v=11.2",
      "./js/engine/state.js": "./js/engine/state.js?v=11.2",
      "./js/engine/supply.js": "./js/engine/supply.js?v=11.2",
      "./js/engine/telegrams.js": "./js/engine/telegrams.js?v=11.2",
      "./js/engine/commanders.js": "./js/engine/commanders.js?v=11.2",
      "./js/engine/systems/replacements.js": "./js/engine/systems/replacements.js?v=11.2",
      "./js/engine/systems/economy.js": "./js/engine/systems/economy.js?v=11.2",
      "./js/engine/systems/supply.js": "./js/engine/systems/supply.js?v=11.2",
      "./js/engine/systems/will.js": "./js/engine/systems/will.js?v=11.2",
      "./js/engine/tutorial.js": "./js/engine/tutorial.js?v=11.2",
      "./js/engine/turn.js": "./js/engine/turn.js?v=11.2",
      "./js/engine/units.js": "./js/engine/units.js?v=11.2",
      "./js/storage.js": "./js/storage.js?v=11.2",
      "./js/ui/animate.js": "./js/ui/animate.js?v=11.2",
      "./js/ui/board.js": "./js/ui/board.js?v=11.2",
      "./js/ui/budget.js": "./js/ui/budget.js?v=11.2",
      "./js/ui/help.js": "./js/ui/help.js?v=11.2",
      "./js/ui/counters.js": "./js/ui/counters.js?v=11.2",
      "./js/ui/demo.js": "./js/ui/demo.js?v=11.2",
      "./js/ui/ledger.js": "./js/ui/ledger.js?v=11.2",
      "./js/ui/locator.js": "./js/ui/locator.js?v=11.2",
      "./js/ui/map.js": "./js/ui/map.js?v=11.2",
      "./js/ui/panel.js": "./js/ui/panel.js?v=11.2",
      "./js/ui/telegram.js": "./js/ui/telegram.js?v=11.2",
      "./js/ui/commander.js": "./js/ui/commander.js?v=11.2",
      "./js/ui/tutorial.js": "./js/ui/tutorial.js?v=11.2",
      "./js/ui/zoom.js": "./js/ui/zoom.js?v=11.2",
      "./js/version.js": "./js/version.js?v=11.2"
    }
  }
  </script>
</head>
<body>
  <!-- Title screen: a dark desk with the folded map on it (docs/STYLE.md §12). -->
  <main id="title-screen" class="screen title-screen">
    <img class="title-map" src="./img/map-west.svg?v=11.2" alt="" aria-hidden="true" decoding="async">
    <div class="title-block">
      <p class="title-kicker">A strategy game of the Great War</p>
      <h1 class="title-name">Western Front</h1>
      <p class="title-dates">1914–1918</p>
    </div>
    <figure id="title-quote" class="title-quote" hidden>
      <blockquote id="title-quote-text"></blockquote>
      <figcaption id="title-quote-who"></figcaption>
    </figure>
    <section id="setup" class="title-setup" hidden aria-label="New campaign">
      <p class="setup-label">Your side</p>
      <div class="setup-row" role="group" aria-label="Your side">
        <button class="btn setup-pick" type="button" data-side="entente" aria-pressed="true">Entente</button>
        <button class="btn setup-pick" type="button" data-side="germany" aria-pressed="false">Germany</button>
        <button class="btn setup-pick" type="button" data-side="both" aria-pressed="false">Two players</button>
      </div>
      <p class="setup-label">Difficulty</p>
      <div class="setup-row setup-levels" role="group" aria-label="Difficulty">
        <button class="btn setup-pick" type="button" data-level="recruit" aria-pressed="false">Recruit</button>
        <button class="btn setup-pick" type="button" data-level="regular" aria-pressed="true">Regular</button>
        <button class="btn setup-pick" type="button" data-level="veteran" aria-pressed="false">Veteran</button>
        <button class="btn setup-pick" type="button" data-level="field-marshal" aria-pressed="false">Field Marshal</button>
      </div>
      <p id="setup-note" class="note"></p>
      <button id="btn-begin" class="btn btn-primary" type="button">Begin the campaign</button>
      <button id="btn-tutorial" class="btn" type="button">Guided first turn (Entente)</button>
    </section>
    <nav class="title-buttons" aria-label="Main menu">
      <button id="btn-new-game" class="btn btn-primary" type="button">New Campaign</button>
      <button id="btn-continue" class="btn" type="button" disabled>Continue</button>
      <button id="btn-title-help" class="btn" type="button">How to Play</button>
      <div class="title-files">
        <button id="btn-export" class="btn btn-small" type="button" disabled>Export save</button>
        <button id="btn-import" class="btn btn-small" type="button">Import save</button>
        <input id="import-file" type="file" accept=".json,application/json" hidden>
      </div>
      <p id="continue-note" class="note">No saved campaign yet.</p>
      <p id="version-note" class="note version-note"></p>
    </nav>
  </main>

  <!-- Game screen: the map (js/ui/map.js + zoom.js) and the info panel (js/ui/panel.js).
       Folded: the map fills the screen and the panel slides up from the bottom.
       Unfolded (700px or wider): the panel sits beside the map. -->
  <main id="game-screen" class="game-screen" hidden>
    <header class="game-bar">
      <!-- The menu: War Office, How to play, settings and the title screen (js/main.js). -->
      <button id="btn-menu" class="btn btn-small btn-menu" type="button" aria-label="Menu" aria-haspopup="true" aria-expanded="false" aria-controls="game-menu"><span class="menu-lines" aria-hidden="true"></span></button>
      <span class="game-bar-when">
        <span id="game-title" class="game-bar-title">December 1914</span>
        <span id="phase-label" class="game-bar-phase"></span>
      </span>
      <!-- Orders, then commit (STYLE.md §6): carries out the queued orders. -->
      <button id="btn-end-phase" class="btn btn-primary btn-small btn-end-phase" type="button"><span class="commit-long">Commit orders</span><span class="commit-short">Commit</span><span id="commit-count" class="commit-count"></span></button>
    </header>
    <nav id="game-menu" class="game-menu" hidden aria-label="Game menu">
      <button id="btn-war-office" class="btn menu-item" type="button">Nations (War Office)</button>
      <button id="btn-telegrams" class="btn menu-item" type="button">Telegrams</button>
      <button id="btn-help" class="btn menu-item" type="button">How to play</button>
      <button id="btn-auto" class="btn menu-item" type="button" aria-pressed="true">Auto budget: on</button>
      <button id="btn-fast" class="btn menu-item" type="button" aria-pressed="false">Fast mode: off</button>
      <button id="btn-back" class="btn menu-item" type="button">Save and quit</button>
    </nav>
    <!-- The phase guide: one line saying what you can do now; tap it for the full
         sentence. Best attacks shows in your attack phase (js/main.js). -->
    <div class="guide-strip">
      <button id="btn-guide" class="guide-toggle" type="button" aria-expanded="false" aria-controls="phase-guide">
        <span id="phase-summary" class="phase-summary"></span><span class="guide-more" aria-hidden="true"></span>
      </button>
      <button id="btn-best" class="btn btn-small btn-guide" type="button">Best attacks</button>
      <p id="phase-guide" class="phase-guide" hidden aria-live="polite"></p>
    </div>
    <section id="map-area" class="map-area" aria-label="Map">
      <div class="map-holder" id="map-holder"></div>
      <!-- The locator: the whole map, small, with the part on screen outlined. Tap it to jump there. -->
      <button id="locator" class="locator" type="button" aria-label="Locator map: tap to jump to that part of the map"></button>
      <!-- Playing a committed turn back (js/ui/animate.js): who's acting, and SKIP. -->
      <div id="playback" class="playback" hidden>
        <span id="playback-label" class="playback-label"></span>
        <button id="btn-skip" class="btn btn-small" type="button">Skip ›</button>
      </div>
      <div id="playback-slip" class="playback-slip" hidden aria-live="polite">
        <p class="pb-title"></p>
        <p class="pb-column"></p>
        <div class="pb-dice"><span class="die"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><span class="die"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span></div>
        <p class="pb-result"></p>
        <p class="pb-stamp"></p>
      </div>
      <!-- The guided first turn's coach (js/ui/tutorial.js). -->
      <div id="coach" class="coach" hidden aria-live="polite"></div>
      <!-- The Nations screen in one tap, with the running Armistice Score (RULES.md §11). -->
      <button id="btn-nations" class="btn btn-nations" type="button"><span class="nations-label">Nations</span><span id="nations-score" class="nations-score"></span></button>
      <div class="zoom-buttons" role="group" aria-label="Zoom">
        <!-- Board | Map (js/main.js): the board is the playing view; the map is the real geography. -->
        <button id="btn-view" class="btn btn-zoom btn-zoom-fit" type="button" aria-label="Show the campaign map">Map</button>
        <button id="btn-zoom-in" class="btn btn-zoom" type="button" aria-label="Zoom in">+</button>
        <button id="btn-zoom-out" class="btn btn-zoom" type="button" aria-label="Zoom out">−</button>
        <button id="btn-zoom-fit" class="btn btn-zoom btn-zoom-fit" type="button" aria-label="Show the whole front line">Front</button>
      </div>
    </section>
    <!-- The War Office ledger (js/ui/ledger.js): opens over the game screen. -->
    <!-- Event telegrams (js/ui/telegram.js): slide up from the bottom, over everything. -->
    <div id="telegram" class="telegram-host" hidden aria-live="assertive"></div>
    <section id="telegram-log" class="war-office" hidden aria-label="Telegrams"></section>
    <section id="war-office" class="war-office" hidden aria-label="War Office"></section>
    <!-- The War Office budget (js/ui/budget.js): opens at the start of a month when
         your budget waits (RULES.md §19.4). -->
    <section id="budget" class="war-office" hidden aria-label="War Office budget"></section>
    <!-- Commander cards (js/ui/commander.js, RULES.md §15): a new card, or "Replace X
         with Y?", full screen. -->
    <section id="commander-screen" class="war-office card-host" hidden aria-label="Commander card" aria-live="polite"></section>
    <section id="panel-sheet" class="panel-sheet" aria-label="Territory details">
      <button id="sheet-handle" class="sheet-handle" type="button" aria-label="Show or hide the details" aria-expanded="false">
        <span class="sheet-grip" aria-hidden="true"></span>
      </button>
      <div id="panel-area" class="panel-area" aria-live="polite"></div>
    </section>
  </main>

  <!-- type="module" lets main.js use import/export. -->
  <!-- How to Play (js/ui/help.js): opens over either screen. -->
  <section id="help" class="war-office" hidden aria-label="How to play"></section>
  <script type="module" src="./js/main.js?v=11.2"></script>
</body>
</html>
