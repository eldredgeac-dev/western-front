<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover lets the page use the whole screen, including round corners;
       the CSS then pads away from the notch and home bar with env(safe-area-inset-*). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f1d18">
  <title>Western Front 1914–18</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <!-- Title screen: shown when the app opens. -->
  <main id="title-screen" class="screen title-screen">
    <div class="title-block">
      <p class="title-kicker">A strategy game of the Great War</p>
      <h1 class="title-name">Western Front</h1>
      <p class="title-dates">1914–18</p>
    </div>
    <nav class="title-buttons" aria-label="Main menu">
      <button id="btn-new-game" class="btn btn-primary" type="button">New Game</button>
      <button id="btn-continue" class="btn" type="button" disabled>Continue</button>
      <p id="continue-note" class="note">No saved game yet.</p>
    </nav>
  </main>

  <!-- Game screen: the map (drawn by js/ui/map.js) and the info panel (js/ui/panel.js). -->
  <main id="game-screen" class="screen game-screen" hidden>
    <header class="game-bar">
      <button id="btn-back" class="btn btn-small" type="button">‹ Back</button>
      <span id="game-title" class="game-bar-title">December 1914</span>
    </header>
    <section id="map-area" class="map-area" aria-label="Map"></section>
    <section id="panel-area" class="panel-area" aria-label="Box details" aria-live="polite"></section>
  </main>

  <!-- type="module" lets main.js use import/export. -->
  <script type="module" src="./js/main.js"></script>
</body>
</html>
