<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Western Front tests</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 16px;
           padding-top: max(16px, env(safe-area-inset-top)); background: #fff; color: #111; }
    #summary { font-size: 1.3rem; font-weight: bold; padding: 12px; border-radius: 8px; }
    .pass { background: #d7f5d7; color: #0a5a0a; }
    .fail { background: #fbd6d6; color: #8a0b0b; }
    li { padding: 6px 4px; }
  </style>
</head>
<body>
  <h1>Tests</h1>
  <p id="summary">Running…</p>
  <ul id="list"></ul>
  <script type="module">
    import { runAll } from './tests.js';
    const results = await runAll();
    const failed = results.filter((r) => !r.ok).length;
    const summary = document.getElementById('summary');
    summary.textContent = failed === 0
      ? `All ${results.length} tests pass`
      : `${failed} of ${results.length} tests FAILED`;
    summary.className = failed === 0 ? 'pass' : 'fail';
    const list = document.getElementById('list');
    for (const r of results) {
      const li = document.createElement('li');
      li.className = r.ok ? 'pass' : 'fail';
      li.textContent = (r.ok ? '✔ ' : '✘ ') + r.name + (r.ok ? '' : ' — ' + r.error);
      list.appendChild(li);
    }
  </script>
</body>
</html>
